workflows:
  android-workflow:
    name: ProcTy Android Build
    max_build_duration: 60
    instance_type: linux_x2 # Hoặc linux_x2 nếu muốn nhanh hơn
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - tranthihonglan2112@gmail.com # Thay bằng email của ông để nhận thông báo
        notify:
          success: true
          failure: true
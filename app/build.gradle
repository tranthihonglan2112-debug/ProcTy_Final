plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.my.procty'
    compileSdk 36 // Hạ xuống 36 vì AGP 8.13 chưa hỗ trợ 37

    defaultConfig {
        applicationId 'com.my.procty'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.3 - By Phúc 💥'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // ĐOẠN CODE QUAN TRỌNG ĐỂ SỬA LỖI TRÙNG LẶP FILE .SO (Giữ lại phòng hờ)
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    
    // THÊM DÒNG NÀY ĐỂ DÙNG SOCKET (Nếu không cần OkHttp thì thôi, tại tui dùng Socket thuần)
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}